    <style>
        /*----------------------------------------------------------------*/
        /* 1. VARIABLES & BASE                       */
        /*----------------------------------------------------------------*/
        :root {
            --color-bg: #F8F7F4;
            --color-text: #4a4238;
            --color-primary: #986A44;
            --color-primary-light: #f3eee8;
            --border-color: #e7e5e4;
            --grid-header-bg: #FDFDFC;
            --grid-day-col-width: 100px;
            --grid-border: 1px solid var(--border-color);
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
        }
        
        /* Styles pour la nav (copiés de formation.html) */
        .nav-link{position:relative;padding-bottom:.25rem;transition:color .3s;}
        .nav-link::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:2px;background-color:var(--color-primary);transform:scaleX(0);transform-origin:bottom right;transition:transform .3s ease-out;}
        .nav-link:hover::after{transform:scaleX(1);transform-origin:bottom left;}
        .nav-link:hover{color:var(--color-primary);}
        .text-primary{color:var(--color-primary);}


        /*----------------------------------------------------------------*/
        /* 2. UI CONTROLS                            */
        /*----------------------------------------------------------------*/
        .tabs-container {
            display: flex;
            justify-content: center;
            background-color: #edebe4;
            padding: 0.5rem;
            border-radius: 0.75rem;
            max-width: 24rem;
            margin-left: auto;
            margin-right: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            color: var(--color-text);
            border: none;
            background-color: transparent;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }

        .tab-btn.active {
            background-color: var(--color-primary);
            color: white;
            box-shadow: 0 4px 10px -2px rgba(152, 106, 68, 0.4);
            transform: translateY(-2px);
        }

        .view-toggle {
            display: none; /* Hidden by default, shown on mobile */
            gap: 0.5rem;
            margin-top: 1.5rem;
        }
        
        .view-toggle button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border: 2px solid transparent;
            border-radius: 999px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #edebe4;
        }

        .view-toggle button.active {
            background-color: var(--color-primary-light);
            color: var(--color-primary);
            border-color: var(--color-primary);
        }

        /*----------------------------------------------------------------*/
        /* 3. TIMETABLE GRID                         */
        /*----------------------------------------------------------------*/
        .timetable-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-top: 2.5rem;
            border: var(--grid-border);
            border-radius: 0.75rem;
            background: white;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }

        .timetable-grid {
            position: relative;
            display: grid;
            grid-template-rows: auto repeat(5, 1fr); /* Header + 5 days */
            min-width: 1800px; /* Force horizontal scroll */
        }

        /* Headers & Day Column */
        .grid-header, .day-label {
            position: sticky;
            background-color: var(--grid-header-bg);
            font-weight: 600;
            z-index: 10;
        }

        .grid-header {
            top: 0;
            text-align: center;
            padding: 1rem 0;
            border-bottom: var(--grid-border);
            font-family: 'ui-monospace', 'Courier New', monospace;
            font-size: 0.8rem;
            border-right: 1px dotted var(--border-color);
        }
        
        .day-label {
            left: 0;
            grid-row: span 1;
            text-align: center;
            padding: 1rem 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.875rem;
            border-right: var(--grid-border);
            border-bottom: var(--grid-border);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Grid Structure */
        .grid-cell-bg {
            border-right: 1px dotted var(--border-color);
            border-bottom: var(--grid-border);
        }
        .grid-cell-bg.full-hour {
             border-right: var(--grid-border);
        }
        .top-left-corner {
            position: sticky;
            top: 0;
            left: 0;
            z-index: 20;
            background-color: var(--grid-header-bg);
            border-right: var(--grid-border);
            border-bottom: var(--grid-border);
        }
       
        /*----------------------------------------------------------------*/
        /* 4. COURSE CELL STYLING                    */
        /*----------------------------------------------------------------*/
        .course-cell {
            position: relative;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            color: white;
            font-size: 0.8rem;
            line-height: 1.3;
        }

        .grid-item:hover .course-cell {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 8px 20px -4px rgba(0,0,0,0.2);
            z-index: 30;
        }
        
        .course-cell .icon { margin-right: 0.4rem; flex-shrink: 0; }
        .course-cell .subject { font-weight: 700; font-size: 0.875rem; display: flex; align-items: center; }
        .course-cell .teacher { opacity: 0.85; margin-top: auto; padding-top: 0.25rem; }

        .course-cell .group {
            position: absolute;
            top: 5px;
            right: 8px;
            font-weight: 700;
            font-size: 0.75rem;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 99px;
        }

        /* Split Cell for Parallel Courses */
        .grid-item.split {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2px;
            padding: 2px;
        }

        /*----------------------------------------------------------------*/
        /* 5. CARD VIEW (MOBILE)                     */
        /*----------------------------------------------------------------*/
        .cards-view { display: none; flex-direction: column; gap: 1.5rem; margin-top: 2.5rem; }
        .day-card { background-color: white; border-radius: 1rem; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .day-card h3 { font-size: 1.5rem; font-weight: 700; color: var(--color-primary); margin-bottom: 1rem; }
        .day-card .course-card { display: flex; padding: 1rem 0; gap: 1rem; }
        .day-card .course-card:not(:last-child) { border-bottom: 1px solid var(--border-color); }
        .course-card .time { flex-basis: 80px; flex-shrink: 0; font-weight: 600; font-family: 'ui-monospace', 'Courier New', monospace; }
        .course-card .details { flex-grow: 1; }
        .course-card .subject { display: flex; align-items: center; font-weight: 600; font-size: 1.1rem; margin-bottom: 0.25rem; }
        .course-card .subject .icon { margin-right: 0.5rem; }
        .course-card .teacher { color: #57534e; }
        .course-card .group { font-weight: 600; color: var(--color-primary); margin-top: 0.25rem; }
        
        /*----------------------------------------------------------------*/
        /* 6. CURRENT TIME INDICATOR                 */
        /*----------------------------------------------------------------*/
        .current-time-indicator {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #f87171;
            z-index: 25;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .current-time-indicator::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -4px;
            width: 10px;
            height: 10px;
            background: #f87171;
            border-radius: 50%;
            box-shadow: 0 0 8px #f87171;
        }

        /*----------------------------------------------------------------*/
        /* 7. RESPONSIVE & UTILS                      */
        /*----------------------------------------------------------------*/
        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .view-toggle { display: flex; justify-content: center; }
        }

    </style>
</head>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        
        // --- 0. INITIALIZE ICONS & UTILS ---
        lucide.createIcons();
        document.getElementById("year").textContent = new Date().getFullYear();
        const mobileMenuButton = document.getElementById("mobile-menu-button");
        const mobileMenu = document.getElementById("mobile-menu");
        if (mobileMenuButton) mobileMenuButton.addEventListener("click", () => mobileMenu.classList.toggle("hidden"));

        // --- 1. DATA & CONFIGURATION ---
        const annee1_data = `
            Lundi : 
            09h00-10h30: Français Technique M. Hajji
            10h30-12h00: Métré des corps de travaux M. Alla
            12h00-12h30 : Pause
            12h30-14h00: Résistance des matériaux (RDM) M. Benhadou
            Mardi : 
            09h00-10h30: Gr1 : CAO-DAO Mme. Bouselham , Gr2 : Art plastique M. Sarhdaoui
            10h30-12h00: Théorie et pratiques d'urbanisme M. Abdeljalil
            12h00-13h30 : Cartographie et photogrammétrie Mme Baye
            13h30-15h00: Gr1 : Bureautique et gestion de base de données M. Elhilali , : Gr2 : Dessin d'architecture Mme Berrabeh
            Mercredi : 
            09h00-10h30 : Gr1 : Art plastique M. Sarhdaoui , Gr2 : CAO-DAO Mme. Bouselham
            10h30-12h00: Matériaux de construction M. Rahou
            12h00-13h30 : Droit administratif  M. Kherraji
            Jeudi : 
            09h00-10h30: Voirie urbaine M. Rahou
            10h30-12h00: Statistique appliquée M. El Hammouti
            12h00-13h30 : Histoire et théorie de l'architecture M. Amri
            13h30-15h00 :  Instruction de dossiers d'autorisation de construire ou de lotir Mme Benhamou
            Vendredi :
            8h30-10h00: Géométrie descriptive M. Kodad
            10h00-11h30: Métier et Formation M. Benaicha
            11h30-13h00: Gr1 : Dessin d'architecture Mme Berrabeh, Gr2 : Bureautique et gestion de base de données M. Elhilali
        `;

        const annee2_data = `
            Lundi : 
            09h00-10h30: Métré des corps de travaux M. Alla
            10h30-12h00: Français Technique M. Hajji
            12h00-13h00 : Pause
            13h00-14h30: Gr1 : Art plastique M. Sarhdaoui , Gr2 : Projet d'architecture Mme Berrabeh
            14h30-16h00 : Gr1 : Projet d'architecture Mme Berrabeh , Gr2 : Art plastique M. Sarhdaoui
            Mardi : 
            09h00-10h30: Projets d'urbanisme M. Abdeljalil
            10h30-12h00 : Topographie Mme Baye
            12h00-13h30 : Gr1 : Modélisation topographique Mme Bensaadoun
            13h30-15h00: Pause
            15h00-16h30: Gr1 : SIG M. Amrani , Gr2 : Infographie 3D M. Sadouqi
            Mercredi : 
            09h00-10h30 : Procédés techniques de construction M. Rahou
            10h30-12h00: Efficacité énergétique Mme Bouslham
            12h00-13h30 : Gr1 : CAO-DAO M. Abdeljalil Y., Gr2 : Modélisation topographique Mme Bensaadoun
            13h30-15h00 :  Gr2 : CAO-DAO M. Abdeljalil Y
            Jeudi : 
            09h00-10h30: Management de projets M. El Hammouti
            10h30-12h00: Assainissement et réseaux divers M. Rahou
            12h00-13h30 : Contrôle des infractions M. Chouitar
            13h30-15h00 :  Organisation et suivi du chantier Mme Mimouni
            15h00-16h30 :  Gr1 : Infographie 3D M. Sadouqi , : Gr2 : SIG M. Amrani
            Vendredi :
            8h30-11h30: Béton armé Mme Mimouni
        `;

        const subjectStyles = {
            'DEFAULT': { icon: 'book', color: '#78716c' }, 'Français Technique': { icon: 'languages', color: '#0ea5e9' },
            'Métré': { icon: 'ruler', color: '#f97316' }, 'Résistance des matériaux': { icon: 'building-2', color: '#ef4444' },
            'CAO-DAO': { icon: 'mouse-pointer-square', color: '#8b5cf6' }, 'Art plastique': { icon: 'palette', color: '#d946ef' },
            'Urbanisme': { icon: 'layout-grid', color: '#10b981' }, 'Cartographie': { icon: 'map', color: '#14b8a6' },
            'Bureautique': { icon: 'file-spreadsheet', color: '#22c55e' }, 'Dessin d\'architecture': { icon: 'pencil-ruler', color: '#64748b' },
            'Matériaux de construction': { icon: 'brick-wall', color: '#a16207' }, 'Droit': { icon: 'scale', color: '#713f12' },
            'Voirie urbaine': { icon: 'road', color: '#475569' }, 'Statistique': { icon: 'bar-chart-2', color: '#6366f1' },
            'Histoire et théorie de l\'architecture': { icon: 'landmark', color: '#a855f7' }, 'Instruction de dossiers': { icon: 'folder-check', color: '#0891b2' },
            'Géométrie descriptive': { icon: 'compass', color: '#3b82f6' }, 'Métier et Formation': { icon: 'briefcase', color: '#7e22ce' },
            'Techniques et recherche d\'emploi': { icon: 'search', color: '#059669' }, 'Projet d\'architecture': { icon: 'drafting-compass', color: '#dc2626' },
            'Topographie': { icon: 'mountain', color: '#16a34a' }, 'Modélisation topographique': { icon: 'cuboid', color: '#2563eb' },
            'SIG': { icon: 'globe-2', color: '#1d4ed8' }, 'Infographie 3D': { icon: 'box-select', color: '#9333ea' },
            'Procédés techniques de construction': { icon: 'construction', color: '#ca8a04' }, 'Efficacité énergétique': { icon: 'bolt', color: '#f59e0b' },
            'Management de projets': { icon: 'presentation', color: '#4f46e5' }, 'Assainissement': { icon: 'droplets', color: '#0284c7' },
            'Contrôle des infractions': { icon: 'siren', color: '#be123c' }, 'Organisation et suivi du chantier': { icon: 'clipboard-list', color: '#4d7c0f' },
            'Béton armé': { icon: 'building', color: '#7f1d1d' },
        };

        const config = {
            days: ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi"],
            timeRange: { start: 8, end: 18 }, // 8am to 6pm
            timeStep: 30 // minutes
        };

        // --- 2. DATA PARSING LOGIC ---
        function parseTimetable(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            const courses = [];
            let currentDay = '';

            for (const line of lines) {
                if (config.days.some(day => line.startsWith(day))) {
                    currentDay = line.replace(':', '').trim();
                    continue;
                }

                if (!currentDay || line.toLowerCase().includes('pause')) continue;
                
                const timeMatch = line.match(/^(\d{1,2}h\d{0,2})\s*-\s*(\d{1,2}h\d{0,2})\s*:\s*(.+)/i);
                if (!timeMatch) continue;

                const [, startTimeStr, endTimeStr, restOfLine] = timeMatch;
                
                const parseTime = (t) => t.replace('h', ':').replace(/h00/g, ':00').padStart(5, '0');
                const startTime = parseTime(startTimeStr);
                const endTime = parseTime(endTimeStr);

                const parts = restOfLine.split(/, | ,| , /).map(p => p.trim().replace(/^:/, '').trim());
                
                for (const part of parts) {
                    let group = 'Tous';
                    let description = part;

                    const groupMatch = part.match(/^(Gr\d)\s*:\s*(.+)/i);
                    if (groupMatch) {
                        group = groupMatch[1].toUpperCase();
                        description = groupMatch[2];
                    }

                    const words = description.split(/\s+/);
                    let teacher = 'N/A';
                    let subject = description;
                    
                    const teacherIndex = words.findIndex(w => w.match(/^(M\.|Mme)/i));
                    if(teacherIndex > -1){
                        teacher = words.slice(teacherIndex).join(' ');
                        subject = words.slice(0, teacherIndex).join(' ');
                    }

                    courses.push({ day: currentDay, startTime, endTime, subject, teacher, group });
                }
            }
            return courses;
        }

        // --- 3. HTML RENDERING LOGIC ---
        function getSubjectStyle(subjectName) {
            const key = Object.keys(subjectStyles).find(k => subjectName.toLowerCase().includes(k.toLowerCase())) || 'DEFAULT';
            return subjectStyles[key];
        }
        function timeToMinutes(time) {
            const [hours, minutes] = time.split(':').map(Number);
            return hours * 60 + minutes;
        }
        function createTimetableHTML(coursesData, year) {
            return `
                <div class="timetable-container" id="timetable-container-${year}">
                    <div class="timetable-wrapper">
                        ${createGridViewHTML(coursesData)}
                    </div>
                    <div class="cards-view">
                        ${createCardsViewHTML(coursesData)}
                    </div>
                </div>
            `;
        }
        
        function createGridViewHTML(courses) {
            const { days, timeRange, timeStep } = config;
            const totalColumns = ((timeRange.end - timeRange.start) * (60 / timeStep));
            
            let gridHTML = `<div class="timetable-grid" style="grid-template-columns: var(--grid-day-col-width) repeat(${totalColumns}, 1fr);">`;
            
            gridHTML += '<div class="current-time-indicator"></div>';
            gridHTML += '<div class="top-left-corner"></div>';

            for (let hour = timeRange.start; hour < timeRange.end; hour++) {
                for (let minute = 0; minute < 60; minute += timeStep) {
                    const time = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
                    gridHTML += `<div class="grid-header">${time}</div>`;
                }
            }

            days.forEach((day, dayIndex) => {
                gridHTML += `<div class="day-label" style="grid-row: ${dayIndex + 2}; grid-column: 1;">${day}</div>`;
                for(let i = 0; i < totalColumns; i++) {
                    const hourClass = (i * timeStep) % 60 === 0 ? 'full-hour' : '';
                    gridHTML += `<div class="grid-cell-bg ${hourClass}" style="grid-row: ${dayIndex + 2}; grid-column: ${i + 2};"></div>`;
                }
            });

            const placedCourses = {};
            courses.forEach(course => {
                const dayIndex = days.indexOf(course.day);
                if (dayIndex === -1) return;

                const startCol = Math.floor((timeToMinutes(course.startTime) - timeRange.start * 60) / timeStep) + 2;
                const gridRow = dayIndex + 2;
                
                const key = `${gridRow}-${startCol}`;
                if (!placedCourses[key]) {
                    placedCourses[key] = [];
                }
                placedCourses[key].push(course);
            });

            let courseItemsHTML = '';
            for (const key in placedCourses) {
                const items = placedCourses[key];
                const firstCourse = items[0];
                
                const dayIndex = days.indexOf(firstCourse.day);
                const startMinutes = timeToMinutes(firstCourse.startTime);
                const endMinutes = timeToMinutes(firstCourse.endTime);
                
                const startCol = Math.floor((startMinutes - timeRange.start * 60) / timeStep) + 2;
                const endCol = Math.ceil((endMinutes - timeRange.start * 60) / timeStep) + 2;
                const durationCols = endCol - startCol;
                if (durationCols <= 0) continue;

                const gridRow = dayIndex + 2;
                const gridColumn = `${startCol} / span ${durationCols}`;
                
                let innerHTML = '';
                items.forEach(course => {
                    const style = getSubjectStyle(course.subject);
                    innerHTML += `
                        <div class="course-cell" style="background-color: ${style.color};">
                             <div class="subject"><i data-lucide="${style.icon}" class="icon w-4 h-4"></i><span>${course.subject}</span></div>
                             <div class="teacher">${course.teacher}</div>
                             ${course.group !== 'Tous' ? `<div class="group">${course.group}</div>` : ''}
                        </div>
                    `;
                });

                const isSplit = items.length > 1 ? 'split' : '';
                courseItemsHTML += `
                    <div class="grid-item ${isSplit}" style="grid-row: ${gridRow}; grid-column: ${gridColumn};">
                        ${innerHTML}
                    </div>
                `;
            }

            gridHTML += `<div class="course-items-container" style="display: contents;">${courseItemsHTML}</div>`;
            gridHTML += '</div>';
            return gridHTML;
        }
        
        function createCardsViewHTML(courses) {
            let cardsHTML = '';
            config.days.forEach(day => {
                const dayCourses = courses
                    .filter(c => c.day === day)
                    .sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
                
                if (dayCourses.length === 0) return;

                cardsHTML += `<div class="day-card"><h3>${day}</h3><div class="courses-list">`;
                dayCourses.forEach(course => {
                    const style = getSubjectStyle(course.subject);
                    cardsHTML += `
                        <div class="course-card">
                            <div class="time">${course.startTime}<br>${course.endTime}</div>
                            <div class="details">
                                <div class="subject" style="color: ${style.color};">
                                    <i data-lucide="${style.icon}" class="icon w-5 h-5"></i>
                                    <span>${course.subject}</span>
                                </div>
                                <div class="teacher">${course.teacher}</div>
                                ${course.group !== 'Tous' ? `<div class="group">${course.group}</div>` : ''}
                            </div>
                        </div>`;
                });
                cardsHTML += `</div></div>`;
            });
            return cardsHTML;
        }

        // --- 4. EVENT LISTENERS & INITIALIZATION ---
        const annee1Container = document.getElementById('timetable-annee1');
        const annee2Container = document.getElementById('timetable-annee2');
        const btnAnnee1 = document.getElementById('btn-annee1');
        const btnAnnee2 = document.getElementById('btn-annee2');
        const viewGridBtn = document.getElementById('view-grid-btn');
        const viewListBtn = document.getElementById('view-list-btn');

        function showAnnee1() {
            annee1Container.classList.remove('hidden');
            annee2Container.classList.add('hidden');
            btnAnnee1.classList.add('active');
            btnAnnee2.classList.remove('active');
            updateCurrentTimeIndicator();
        }
        function showAnnee2() {
            annee1Container.classList.add('hidden');
            annee2Container.classList.remove('hidden');
            btnAnnee1.classList.remove('active');
            btnAnnee2.classList.add('active');
            updateCurrentTimeIndicator();
        }
        btnAnnee1.addEventListener('click', showAnnee1);
        btnAnnee2.addEventListener('click', showAnnee2);
        viewGridBtn.addEventListener('click', () => {
            document.querySelectorAll('.timetable-wrapper').forEach(el => el.style.display = 'block');
            document.querySelectorAll('.cards-view').forEach(el => el.style.display = 'none');
            viewGridBtn.classList.add('active');
            viewListBtn.classList.remove('active');
        });

        viewListBtn.addEventListener('click', () => {
            document.querySelectorAll('.timetable-wrapper').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.cards-view').forEach(el => el.style.display = 'flex');
            viewGridBtn.classList.remove('active');
            viewListBtn.classList.add('active');
        });

        function updateCurrentTimeIndicator() {
            const indicator = document.querySelector('.timetable-container:not(.hidden) .current-time-indicator');
            if (!indicator) return;

            const now = new Date();
            const currentDayIndex = now.getDay() - 1; // 0=Mon
            
            const grid = indicator.closest('.timetable-grid');
            const dayRow = grid.querySelector(`.day-label[style*="grid-row: ${currentDayIndex + 2}"]`);
            
            if (!dayRow) {
                indicator.style.opacity = '0';
                return;
            }

            const startOfDayMinutes = config.timeRange.start * 60;
            const endOfDayMinutes = config.timeRange.end * 60;
            const nowMinutes = now.getHours() * 60 + now.getMinutes();

            if (nowMinutes < startOfDayMinutes || nowMinutes > endOfDayMinutes) {
                indicator.style.opacity = '0';
                return;
            }

            const totalMinutes = (config.timeRange.end - config.timeRange.start) * 60;
            const minutesFromStart = nowMinutes - startOfDayMinutes;
            const leftPercentage = (minutesFromStart / totalMinutes) * 100;
            
            const gridContentWidth = grid.offsetWidth - parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--grid-day-col-width'));
            
            indicator.style.top = `${dayRow.offsetTop}px`;
            indicator.style.height = `${dayRow.offsetHeight}px`;
            indicator.style.left = `calc(var(--grid-day-col-width) + ${leftPercentage / 100} * ${gridContentWidth}px)`;
            indicator.style.opacity = '1';
        }

        // --- 5. INITIAL RENDER ---
        function init() {
            const courses1 = parseTimetable(annee1_data);
            const courses2 = parseTimetable(annee2_data);
            
            annee1Container.innerHTML = createTimetableHTML(courses1, 1);
            annee2Container.innerHTML = createTimetableHTML(courses2, 2);

            showAnnee1();
            lucide.createIcons();
            
            setInterval(updateCurrentTimeIndicator, 60000); // Update every minute
            updateCurrentTimeIndicator();
            window.addEventListener('resize', updateCurrentTimeIndicator);
        }
        
        init();
    });
    </script>
</body>
</html>
